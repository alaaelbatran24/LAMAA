<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a22;--sf:#0e2a36;--ink:#e8f4f8;--mu:#9bb8c4;--ln:#1d4152;--aq:#3cd0e4;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#071a22;--sf:#0e2a36;--ink:#e8f4f8;--mu:#9bb8c4;--ln:#1d4152;--aq:#3cd0e4}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:60px;gap:10px}
.logo{font-weight:900;font-size:1.4rem;color:var(--aq);text-decoration:none}
.nav div{display:flex;gap:8px;align-items:center}
.nav a.c,.lang{min-height:42px;display:inline-flex;align-items:center;background:var(--sun);color:#3a2a00;padding:0 16px;border-radius:999px;font:inherit;font-weight:800;text-decoration:none;border:0;cursor:pointer}
.lang{background:transparent;color:var(--ink);border:2px solid var(--ln)}
.hero{background:linear-gradient(160deg,#0a3d52,#0d6a85);color:#fff;padding:44px 0 56px}
.hero h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.15;margin:0 0 12px;font-weight:900;white-space:pre-line}
.hero p{font-size:1.1rem;margin:0 0 20px;color:#d4eef5;max-width:40ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;cursor:pointer;font:inherit;font-weight:800;padding:0 22px;border-radius:12px;background:var(--sun);color:#3a2a00;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;background:rgba(255,255,255,.14);padding:2px 14px;border-radius:999px;margin:14px 6px 0 0;font-weight:600}
:focus-visible{outline:3px solid var(--aq);outline-offset:2px}
section{padding:40px 0}
h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 6px;font-weight:900}
.sub{color:var(--mu);margin:0 0 20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.svc{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:18px}
.svc .p{font-size:1.7rem;font-weight:900;color:var(--aq)}.svc small{color:var(--mu);display:block}
.svc.pl{border:2px solid var(--aq)}
#book{background:var(--sf);border-block:1px solid var(--ln)}
.book{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}
fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}
legend{font-weight:800;font-size:1.1rem;margin-bottom:8px;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{position:relative;border:2px solid var(--ln);border-radius:14px;padding:10px 14px;cursor:pointer;background:var(--bg);display:block;min-height:52px}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;width:100%;height:100%}
.opt:has(input:checked){border-color:var(--aq);background:color-mix(in srgb,var(--aq) 14%,var(--bg))}
.opt b{display:block}.opt span{color:var(--mu);font-size:.88rem}
.brc{padding:8px}
.brc svg{width:100%;height:92px;border-radius:10px;display:block;margin-bottom:6px}
label.f{display:block;font-weight:600;margin-bottom:10px}
input[type=text],input[type=tel],input[type=email],input[type=date]{width:100%;min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px;-webkit-appearance:none;appearance:none}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hid{display:none!important}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.sl{font:inherit;font-size:.85rem;font-weight:700;min-height:44px;padding:4px 2px;border-radius:10px;border:2px solid var(--ln);background:#fff;color:#0b2a36;cursor:pointer;direction:ltr}
.sl.busy{background:var(--red);border-color:var(--red);color:#fff}
.sl.past{background:#e9eef0;color:#9aa8ae;cursor:not-allowed;border-color:#e9eef0}
.sl.sel{background:var(--aq);border-color:var(--aq);color:#04242c}
.leg{display:flex;gap:14px;font-size:.85rem;color:var(--mu);margin:8px 0 0;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;border:2px solid var(--ln);vertical-align:-1px}
.pbox{background:var(--bg);border:1px dashed var(--ln);border-radius:14px;padding:14px;margin-top:10px}
.err{color:var(--red);font-weight:700;min-height:1.5em;margin:4px 0}
.hint{background:var(--bg);border:1px dashed var(--ln);border-radius:12px;padding:12px 14px;color:var(--mu)}
.sum{position:sticky;top:76px;background:var(--bg);border:2px solid var(--ln);border-radius:20px;padding:20px}
.sum h3{margin:0 0 10px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--ln)}
.tot{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:900;margin:12px 0}
.sum .btn{width:100%;background:var(--deep);color:#fff}
.note{font-size:.85rem;color:var(--mu);margin-top:8px}
.done{text-align:center;padding:10px}
.ck{width:70px;height:70px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2.2rem;margin:0 auto 10px}
.qr{display:inline-block;background:#fff;padding:12px;border-radius:14px;margin:8px 0}
.code{font-size:2rem;font-weight:900;letter-spacing:2px;direction:ltr}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.acts .btn{background:var(--deep);color:#fff;padding:0 18px}
.bk{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 16px;margin-bottom:10px;flex-wrap:wrap}
.bk.x{opacity:.55}
.bk .btn{color:#fff;min-height:40px;padding:0 14px;background:var(--red)}
.bk .btn.g{background:var(--ok)}
.rdy{background:var(--ok);color:#fff;font-weight:800;border-radius:999px;padding:2px 12px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:14px 18px;border-radius:14px;box-shadow:var(--sh);z-index:50;font-weight:700}
footer{background:var(--deep);color:#cfe9f0;padding:22px 0;text-align:center}
@media (min-width:700px){.slots{grid-template-columns:repeat(6,1fr)}}
@media (max-width:820px){.book,.g3{grid-template-columns:1fr}.sum{position:static}.r2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{header,.hero,section:not(#book),footer,.acts{display:none}}
</style>
</head>

 if(id==="westbay")s='<path d="M20 96V50h16v46zM40 96V30h14v66zM58 96V12l7-8 7 8v84zM76 96V36h16v60zM96 96V56h14v40zM114 96V26h14v70z" fill="#0a1a38"/><path d="M27 54v40M47 34v60M65 18v76M84 40v54M103 60v34M121 30v64" stroke="#ffd966" stroke-width="7" stroke-dasharray="2 6" opacity=".85"/><circle cx="140" cy="16" r="2" fill="#fff"/><circle cx="12" cy="24" r="1.5" fill="#fff"/>';
 if(id==="sadd")s='<path d="M0 96V58h30v38zM34 96V40h28v56zM66 96V52h24v44zM94 96V30h26v66zM124 96V60h36v36z" fill="#6f93ad"/><path d="M40 46v46M100 36v56M72 58v34" stroke="#e8f6ff" stroke-width="9" stroke-dasharray="3 7" opacity=".8"/><rect y="82" width="160" height="14" fill="#3a4a54"/><path d="M0 89h160" stroke="#fff" stroke-width="2" stroke-dasharray="8 8"/><circle cx="22" cy="20" r="9" fill="#fff6c2"/>';
 if(id==="lusail")s='<path d="M0 78h160v18H0z" fill="#2c1f55"/><path d="M52 80L60 18l8 62zM84 80l8-62 8 62z" fill="#f6d9e6"/><path d="M60 18v62M92 18v62" stroke="#a1688f" stroke-width="2"/><path d="M110 20a9 9 0 1 0 8 14 7 7 0 1 1-8-14z" fill="#fff3b0"/>';
 if(id==="wakra")s='<rect y="64" width="160" height="32" fill="#2a8ba8"/><path d="M0 64v-12h18v-6h14v6h12v12zM108 64V50h18v-8h12v8h22v14z" fill="#d9b277"/><path d="M52 74q28 14 56 0l-7-8H59z" fill="#7a4a21"/><path d="M80 66V28l24 36z" fill="#fff8e6"/><circle cx="130" cy="20" r="10" fill="#fff"/>';
 return '<svg viewBox="0 0 160 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+C[0]+'"/><stop offset="1" stop-color="'+C[1]+'"/></linearGradient></defs><rect width="160" height="96" fill="url(#g'+id+')"/>'+s+'</svg>';
}
function radios(el,name,items,lab,cls){el.innerHTML=items.map(function(x){var l=lab(x);return '<label class="opt '+(cls||"")+'">'+(l[2]||"")+'<input type="radio" name="'+name+'" value="'+x[0]+'"><b>'+l[0]+'</b><span>'+l[1]+'</span></label>'}).join("")}
function build(){
 var d=load(DR,{});
 radios($("modes"),"mode",[["one"],["sub"]],function(x){return [t(x[0]==="one"?"one":"sb"),""]});
 radios($("plans"),"plan",PL,function(x){return [t(x[0]),t(x[0]+"d")]});
 radios($("branches"),"br",BR,function(x){return [BN(x),(lang==="ar"?"الدوحة · ":"Doha · ")+"24h",art(x[0])]},"brc");
 radios($("sizes"),"size",SZ,function(x){return [t("szN")[x[0]],x[1]?"+"+x[1]+" "+t("cur"):"—"]});
 radios($("pks"),"pk",PK,function(x){return [t("pkg")[x[0]],x[1]+" "+t("cur")]});
 $("addons").innerHTML=AD.map(function(x){return '<label class="opt"><input type="checkbox" name="add" value="'+x[0]+'"><b>'+t("ad")[x[0]]+'</b><span>'+x[1]+" "+t("cur")+'</span></label>'}).join("");
 $("svcCards").innerHTML=PK.slice(1).map(function(x){return '<div class="svc"><b>'+t("pkg")[x[0]]+'</b><div class="p">'+x[1]+" "+t("cur")+'</div><small>'+x[2].length+" "+t("svc_n")+'</small></div>'}).join("")+PL.map(function(p){return '<div class="svc pl"><b>'+t(p[0])+'</b><div class="p">−'+p[2]+'%</div><small>'+t(p[0]+"d")+'</small></div>'}).join("");
 setv("br",d.br||"pearl");setv("mode",d.mode||"one");setv("plan",d.plan||"m1");setv("size",d.size==="big"?"big":"small");setv("pk",d.pk||"none");
 (d.add||[]).forEach(function(a){var e=document.querySelector("input[name=add][value="+a+"]");if(e)e.checked=true});
}
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
 $("lg").textContent=lang==="ar"?"EN":"عربي";$("name").placeholder=lang==="ar"?"الاسم الكامل":"Full name";
}
function seed(b,d){var h=0,s=b+d;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;var k=h%48;return [k*30,((k+5)%48)*30,((k+11)%48)*30]}
function bookings(){return load(BK,[])}
function busySet(b,d){var s=seed(b,d);bookings().forEach(function(k){if(!k.x&&k.br===b&&k.date===d)s.push(k.start)});return s}
function okAt(bs,m,d){if(m<0||m>=1440)return false;if(d===today()&&m<=nowMin())return false;return bs.indexOf(m)===-1}
function findFree(b,d,pref){var bs=busySet(b,d);for(var o=0;o<48;o++){var a=pref+o*30,c=pref-o*30;if(okAt(bs,a,d))return a;if(o&&okAt(bs,c,d))return c}return null}
function renderSlots(){
 var b=val("br");if(!b)return;
 var d=$("date").value,bs=busySet(b,d),isT=d===today(),now=nowMin(),out="";
 for(var m=0;m<1440;m+=30){
  var c="sl";if(isT&&m<=now)c+=" past";else if(bs.indexOf(m)>-1)c+=" busy";
  if(start===m)c+=" sel";
  out+='<button type="button" class="'+c+'" data-h="'+m+'">'+rng(m)+"</button>";
 }
 $("slots").innerHTML=out;
}
function pick(m){
 var b=val("br"),d=$("date").value,bs=busySet(b,d),msg=$("slotMsg");msg.style.color="var(--red)";
 if(d===today()&&m<=nowMin()){msg.textContent=t("s_past");return}
 if(bs.indexOf(m)>-1){msg.textContent=t("s_busy");return}
 start=m;msg.style.color="var(--ok)";msg.textContent=t("s_ok")+rng(m);
 renderSlots();update();
}
function perVisit(){
 var pk=PK.filter(function(x){return x[0]===val("pk")})[0],sz=SZ.filter(function(x){return x[0]===val("size")})[0],L=[],s=0,cov=pk[2];
 if(pk[0]!=="none"){L.push([t("pkg")[pk[0]],pk[1]]);s+=pk[1]}
 if(sz&&sz[1]){L.push([t("szN")[sz[0]],sz[1]]);s+=sz[1]}
 document.querySelectorAll("input[name=add]:checked").forEach(function(c){if(cov.indexOf(c.value)>-1)return;var a=AD.filter(function(x){return x[0]===c.value})[0];L.push([t("ad")[a[0]],a[1]]);s+=a[1]});
 return {L:L,s:s};
}
function plan(){return val("mode")==="sub"?PL.filter(function(p){return p[0]===val("plan")})[0]:null}
function calc(){
 var v=perVisit(),L=v.L,tot=v.s,p=plan(),b=BR.filter(function(x){return x[0]===val("br")})[0];
 if(b)L.unshift([BN(b),null]);
 if(p){L.unshift([t(p[0])+" · "+p[1]+"×",null]);tot=Math.round(v.s*p[1]*(1-p[2]/100));L.push([t("disc"),"−"+p[2]+"%"])}
 if(start!==null)L.push([$("date").value+" · "+rng(start),null]);
 $("lines").innerHTML=L.map(function(l){return '<div class="ln"><span>'+l[0]+"</span><span>"+(l[1]===null?"":(typeof l[1]==="number"?l[1]+" "+t("cur"):l[1]))+"</span></div>"}).join("");
 $("tot").textContent=tot+" "+t("cur");return tot;
}
function detailsOk(){return $("name").value.trim().length>1&&/^[3567]\d{7}$/.test($("phone").value.trim())&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("email").value.trim())&&$("car").value.trim().length>2}
function covUpdate(){
 var pk=PK.filter(function(x){return x[0]===val("pk")})[0],cov=pk?pk[2]:[];
 document.querySelectorAll("input[name=add]").forEach(function(c){var on=cov.indexOf(c.value)>-1;if(on)c.checked=false;c.disabled=on;c.closest("label").style.opacity=on?".45":"1"});
}
function update(){ covUpdate();
 var br=val("br"),sub=!!plan();
 $("sec-time").classList.remove("hid");$("plans").classList.toggle("hid",!sub);$("planNote").classList.toggle("hid",!sub);
 $("dayL").textContent=t(sub?"day2":"day");
 var rdy=!!br&&start!==null&&detailsOk();
 $("sec-pay").classList.toggle("hid",!rdy);$("lock").classList.toggle("hid",rdy);$("go").disabled=!rdy;
 $("bx-card").classList.toggle("hid",val("pay")!=="card");
 calc();persist();
}
function persist(){
 var ad=[];document.querySelectorAll("input[name=add]:checked").forEach(function(c){ad.push(c.value)});
 save(DR,{br:val("br"),mode:val("mode"),plan:val("plan"),size:val("size"),pk:val("pk"),add:ad,date:$("date").value,start:start,name:$("name").value,phone:$("phone").value,email:$("email").value,car:$("car").value,pay:val("pay"),ce:$("ce").value});
}
function restore(){
 var d=load(DR,{});["name","phone","email","car","ce"].forEach(function(k){if(d[k])$(k).value=d[k]});
 $("date").min=today();$("date").value=(d.date&&d.date>=today())?d.date:today();
 if(d.pay)setv("pay",d.pay);start=(typeof d.start==="number"&&d.date===$("date").value)?d.start:null;
}
function luhn(s){var u=0,a=false;for(var i=s.length-1;i>=0;i--){var n=+s[i];if(a){n*=2;if(n>9)n-=9}u+=n;a=!a}return u%10===0}
function fail(k,id){$("err").textContent=t(k);$(id).focus();return false}
function validPay(){
 $("err").textContent="";if(val("pay")!=="card")return true;
 var n=$("cn").value.replace(/\s/g,"");if(n.length!==16||!luhn(n))return fail("e_cn","cn");
 var m=$("ce").value.match(/^(\d{2})\/(\d{2})$/);if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())return fail("e_ce","ce");
 if(!/^\d{3}$/.test($("cc").value))return fail("e_cc","cc");
 return true;
}
function toast(m){var e=$("toast");e.textContent=m;e.classList.remove("hid");setTimeout(function(){e.classList.add("hid")},9000)}
function when(k){var h=Math.floor(k.start/60),mm=k.start%60;return new Date(k.date+"T"+pad(h)+":"+pad(mm)+":00")}
function notifyOS(m){try{if("Notification" in window&&Notification.permission==="granted")new Notification("Lamaa",{body:m})}catch(e){}}
function confirmBk(){
 if(!validPay())return;
 var b=val("br"),d0=$("date").value;
 if(!okAt(busySet(b,d0),start,d0)){start=null;renderSlots();update();$("slotMsg").textContent=t("s_busy");return}
 var p=plan(),cnt=p?p[1]:1,total=calc(),id="LM"+Math.floor(100000+Math.random()*900000),all=bookings(),vis=[];
 for(var i=0;i<cnt;i++){
  var d=addDays(d0,7*i),h=i===0?start:findFree(b,d,start);if(h===null)continue;
  var k={uid:id+"-"+(i+1),id:id,br:b,date:d,start:h,dur:WASH,total:total,name:$("name").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),car:$("car").value.trim(),pay:val("pay"),plan:p?p[0]:"",r:false,x:false,ready:false};
  all.push(k);vis.push(k);
 }
 save(BK,all);start=null;$("cn").value="";$("cc").value="";update();
 showDone(vis,total);renderMine();
 if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
}
function showDone(vis,total){
 var k=vis[0],b=BR.filter(function(x){return x[0]===k.br})[0],pn=k.pay==="card"?t("paid"):t("cashN");
 var q="LAMAA|"+k.id+"|"+k.br+"|"+k.date+"|"+fmt(k.start)+"|"+vis.length+"|"+k.phone;
 var rows=vis.slice(0,5).map(function(v){return v.date+" · "+rng(v.start)}).join("<br>")+(vis.length>5?"<br>"+t("more"):"");
 var msg="Lamaa — "+k.id+"\n"+BN(b)+"\n"+vis.slice(0,5).map(function(v){return v.date+" "+rng(v.start)}).join("\n")+"\n"+total+" QAR";
 $("formWrap").classList.add("hid");var D=$("doneBox");D.classList.remove("hid");
 D.innerHTML='<div class="done"><div class="ck" aria-hidden="true">✓</div><h2>'+t("carDone")+'</h2><p>'+BN(b)+"<br>"+rows+'</p><div class="code">'+k.id+'</div><div class="qr" id="qrBox"></div><p>'+t("showQ")+"</p><p>"+pn+" — "+total+" "+t("cur")+'</p><div class="acts"><a class="btn" href="mailto:'+encodeURIComponent(k.email)+"?subject="+encodeURIComponent("Lamaa "+k.id)+"&body="+encodeURIComponent(msg)+'">'+t("mail")+'</a><a class="btn" href="sms:+974'+k.phone+"?body="+encodeURIComponent(msg)+'">'+t("sms")+'</a><button class="btn" id="pr" type="button">'+t("print")+'</button><button class="btn" id="again" type="button">'+t("again")+"</button></div></div>";
 try{new QRCode($("qrBox"),{text:q,width:170,height:170})}catch(e){}
 $("pr").onclick=function(){window.print()};
 $("again").onclick=function(){D.classList.add("hid");$("formWrap").classList.remove("hid");renderSlots();update()};
 $("book").scrollIntoView();
}
function renderMine(){
 var bs=bookings().slice().reverse(),now=new Date();
 $("mine").innerHTML=bs.length?bs.map(function(k){
  var b=BR.filter(function(x){return x[0]===k.br})[0],can=!k.x&&!k.ready&&(when(k)-now)>=2*3600e3;
  var right=k.x?"<span>"+t("cancelled")+"</span>":(k.ready?'<span class="rdy">'+t("rdy")+"</span>":(can?'<button class="btn" data-c="'+k.uid+'" type="button">'+t("cancel")+"</button>":'<small class="note">'+t("late")+"</small>"));
  var staff=(!k.x&&!k.ready)?'<button class="btn g" data-r="'+k.uid+'" type="button">'+t("rdyBtn")+"</button>":"";
  return '<div class="bk'+(k.x?" x":"")+'"><div><b dir="ltr">'+k.id+"</b>"+(k.plan?" · "+t(k.plan):"")+" · "+BN(b)+"<br>"+k.date+" · "+rng(k.start)+' · <span dir="ltr">'+k.phone+"</span></div><div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">"+staff+right+"</div></div>";
 }).join(""):'<p class="note">'+t("none")+"</p>";
}
function markReady(uid){
 var bs=bookings(),hit=null;bs.forEach(function(k){if(k.uid===uid&&!k.x&&!k.ready){k.ready=true;k.readyAt=Date.now();hit=k}});
 if(!hit)return;save(BK,bs);
 var m=t("rdyMsg");toast(m);notifyOS(m);
 try{window.location.href="sms:+974"+hit.phone+"?body="+encodeURIComponent("Lamaa: "+m+" ("+hit.id+")")}catch(e){}
 renderMine();
}
function tick(){
 var bs=bookings(),now=new Date(),ch=false;
 bs.forEach(function(k){if(k.x)return;var df=when(k)-now;
  if(!k.r&&df>0&&df<=3600e3){k.r=true;ch=true;var m=t("remind")+" "+BN(BR.filter(function(x){return x[0]===k.br})[0])+" ("+rng(k.start)+")";toast(m);notifyOS(m)}
 });
 if(ch)save(BK,bs);renderMine();
}
document.addEventListener("click",function(e){
 var s=e.target.closest(".sl");if(s){pick(+s.dataset.h);return}
 var r=e.target.closest("[data-r]");if(r){markReady(r.dataset.r);return}
 var c=e.target.closest("[data-c]");if(c){var bs=bookings();bs.forEach(function(k){if(k.uid===c.dataset.c&&!k.ready&&(when(k)-new Date())>=2*3600e3)k.x=true});save(BK,bs);renderMine();renderSlots()}
});
document.addEventListener("change",function(e){
 var n=e.target.name;
 if(n==="svc"||n==="br"||e.target.id==="date"){start=null;$("slotMsg").textContent=""}
 if(n==="br"){$("sec-time").scrollIntoView({behavior:"smooth",block:"nearest"})}
 renderSlots();update();
});
document.addEventListener("input",function(e){if(e.target.closest("#formWrap"))update()});
$("cn").addEventListener("input",function(){var v=this.value.replace(/\D/g,"").slice(0,16);this.value=v.replace(/(.{4})/g,"$1 ").trim()});
$("ce").addEventListener("input",function(){var v=this.value.replace(/\D/g,"").slice(0,4);this.value=v.length>2?v.slice(0,2)+"/"+v.slice(2):v});
$("go").addEventListener("click",confirmBk);
$("lg").addEventListener("click",function(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lm_lang",lang)}catch(e){}persist();build();applyLang();renderSlots();update();renderMine();if(!$("doneBox").classList.contains("hid")){$("doneBox").classList.add("hid");$("formWrap").classList.remove("hid")}});
$("yr").textContent=new Date().getFullYear();
build();restore();applyLang();renderSlots();update();renderMine();tick();setInterval(tick,30000);
})();
</script>
</body>
</html>
